name: Build and release

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      increase-type:
        type: choice
        description: Version increase (MAJOR.MINOR.PATCH); NONE releases the current version
        options:
          - patch
          - minor
          - major
          - NONE
        default: patch
      auto-increase:
        type: boolean
        description: Carry patch and minor at 10 (1.0.9 becomes 1.1.0; 1.9.9 becomes 2.0.0)
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test version management
        run: bash ci/test_update_version.sh
      - run: ./gradlew clean build --no-daemon --console=plain

  release:
    name: Build, tag, and release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: project-release
      cancel-in-progress: true
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release branch and commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]]; then
            echo "::error::Run releases from the default branch ($RELEASE_BRANCH)."
            exit 1
          fi
          git fetch origin "$RELEASE_BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "::error::The branch has advanced. Run the workflow again on its latest commit."
            exit 1
          fi

      - name: Test version management
        run: bash ci/test_update_version.sh

      - name: Prepare release version
        id: version
        shell: bash
        env:
          INCREASE_TYPE: ${{ inputs.increase-type }}
          AUTO_INCREASE: ${{ inputs.auto-increase }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(bash ci/update_version.sh "$INCREASE_TYPE" "$AUTO_INCREASE")"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "::error::Tag $RELEASE_VERSION already exists. Choose another version increase."
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test release version
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Commit version and push tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_BRANCH"
          if [[ "$GITHUB_SHA" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "::error::The branch changed during the build. Run the workflow again."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m "Bump version to $RELEASE_VERSION"
          fi
          git tag -a "$RELEASE_VERSION" -m "Version $RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_VERSION"

      - name: Create release with JARs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" build/libs/*.jar \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            --generate-notes \
            --latest
